workdir = "./local/traced_repos"
shallow = true
extract_dir = "results"
refined_dir = "refined"
plan_turns = 100
work_turns = 100
refine_turns = 100
timeout = 7200
verbose = true
max_workers = 4

# ── linear algebra (LU, QR, SVD, Cholesky, eigenvalues) ──
[[repo]]
url = "https://github.com/dimforge/nalgebra.git"

# ── sparse linear algebra (LDLᵀ / Cholesky) ──
#   Workspace contains `sprs` + `sprs-ldl` + `sprs-triangular`. Extract sparse LDLᵀ
#   numeric factorization + triangular solve (spec L·D·Lᵀ = PᵀAP), see local/linear_algebra_libraries_survey.md §2.3.
#   Core is pure Rust (num-traits + sprs); optional suitesparse backends are C/prefix-only, exclude.
#   License: LGPL-2.1.
[[repo]]
url = "https://github.com/sparsemat/sprs.git"

# ── FFT ──
[[repo]]
url = "https://github.com/ejmahler/RustFFT.git"

# ── graph algorithms (Dijkstra, MST, SCC, toposort) ──
[[repo]]
url = "https://github.com/petgraph/petgraph.git"

# ── computational geometry (Delaunay triangulation, convex hull) ──
[[repo]]
url = "https://github.com/acgetchell/delaunay.git"

# ── N-dimensional arrays ──
[[repo]]
url = "https://github.com/rust-ndarray/ndarray.git"

# ── number theory (gcd, lcm, primes, fibonacci) ── Nat ──
[[repo]]
url = "https://github.com/TheAlgorithms/Rust.git"

# ── production number theory / big-integer (rust-num) ── Int ──
#   Extract the *core* algorithms; strip trait/macro wrappers (see local/integer_target.md §F).
[[repo]]
url = "https://github.com/rust-num/num-integer.git"

[[repo]]
url = "https://github.com/rust-num/num-bigint.git"

[[repo]]
url = "https://github.com/uutils/num-prime.git"

# ── polynomial arithmetic (add, mul, eval) ── Polynomial ──
[[repo]]
url = "https://github.com/deepsafe/polynomials.git"

# ── complex numbers (add, mul, magnitude) ── Complex ──
[[repo]]
url = "https://github.com/kevmasajedi/complexible.git"

# ── set operations (intersection, difference, union-find) ── Finset ──
[[repo]]
url = "https://github.com/POFKLabs/pofk_algorithm_rust.git"

# ── cryptographic hashing (SHA-256, SHA-512) ──
[[repo]]
url = "https://github.com/RustCrypto/hashes.git"
