name = "Comparator"
version = "0.1.0"
defaultTargets = ["comparator"]

[[lean_lib]]
name = "Comparator"

[[lean_exe]]
name = "comparator"
root = "Main"

[[require]]
scope = "leanprover"
name = "Lean4Checker"
rev = "b7398199245524275543dec6113229c9bb4902e5"

# Pin to the lean4export rev that matches the v4.31.0 toolchain (the upstream
# lakefile says `rev = "master"`, which drifts to a newer, incompatible toolchain).
[[require]]
scope = "leanprover"
name = "lean4export"
rev = "8554815c2dc6b7abe99ec1f08849c9759ba77947"
