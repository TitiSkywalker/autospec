[package]
name = "translator"
version = "0.1.0"
edition = "2021"
description = "Translate Rust projects into Lean via Charon + Aeneas"

[[bin]]
name = "translator"
path = "src/main.rs"

[[bin]]
name = "translate_all"
path = "src/bin/translate_all.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# JSON manipulation for LLBC
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Text rewriting
regex = "1"

# Cargo.toml parsing
toml = "0.8"

# Temporary directories
tempfile = "3"

# Recursive directory walking
walkdir = "2"

# Error handling
anyhow = "1"

